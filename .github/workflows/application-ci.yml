name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "api-server/**"
      - "client-server/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/application-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-deployment
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: infinitynevo
  AWS_REGION: eu-north-1
  ECS_CLUSTER: yams-shells-dev-cluster
  ECS_SERVICE: yams-shells-dev-service

jobs:
  application-ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        shell: bash
        run: |
          api_changed=false
          client_changed=false
          frontend_changed=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            api_changed=true
            client_changed=true
            frontend_changed=true
          else
            before="${{ github.event.before }}"

            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi

            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"

            while IFS= read -r file; do
              case "$file" in
                api-server/*)
                  api_changed=true
                  ;;
                client-server/*)
                  client_changed=true
                  ;;
                frontend/*)
                  frontend_changed=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "api=$api_changed" >> "$GITHUB_OUTPUT"
          echo "client=$client_changed" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"

          {
            echo "### Changed components"
            echo "- API server: $api_changed"
            echo "- Client server: $client_changed"
            echo "- Frontend: $frontend_changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check Python code
        run: ruff check api-server/app client-server/app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check frontend/scripts/app.js
          node --check frontend/scripts/ocean.js

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Login to Docker Hub
        if: >-
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.client == 'true' ||
          steps.changes.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API server image
        if: steps.changes.outputs.api == 'true'
        run: |
          image="$DOCKERHUB_USERNAME/yams-api-server"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" ./api-server
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Build and push client server image
        if: steps.changes.outputs.client == 'true'
        run: |
          image="$DOCKERHUB_USERNAME/yams-client-server"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" ./client-server
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          image="$DOCKERHUB_USERNAME/yams-frontend"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" ./frontend
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Configure AWS credentials
        if: >-
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.client == 'true' ||
          steps.changes.outputs.frontend == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application to ECS
        if: >-
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.client == 'true' ||
          steps.changes.outputs.frontend == 'true'
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "ECS service deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
